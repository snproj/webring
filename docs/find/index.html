// Applies a saved table-of-contents width before the first paint.
//
// This is a tiny inline counterpart to toc-resize.js: it runs in the page head so that
// returning desktop readers do not see the default width flash to their saved width.
// It only records the width in the --verso-toc-user-width custom property; the
// stylesheet clamps it and ignores it on mobile, and toc-resize.js then takes over the
// interactive resizing. Keep the storage key in sync with toc-resize.js.

(function () {
    try {
        const saved = localStorage.getItem("verso-toc-width");
        // Parse to a number (as toc-resize.js does) and write that back, so a stored
        // value with stray whitespace becomes a valid length rather than `" 420 px"`.
        const width = saved === null ? NaN : Number(saved);
        if (Number.isFinite(width)) {
            document.documentElement.style.setProperty("--verso-toc-user-width", `${width}px`);
        }
    } catch (_) {
        // Leave the default width in place when local storage is unavailable.
    }
})();
</script>

    <style>
.marginalia-note {
  box-sizing: border-box;
  padding: 0.5rem;
  font-family: var(--verso-text-font-family);
  font-size: 1rem;
  font-weight: normal;
  font-style: normal;
  line-height: 1.45;
  color: var(--verso-text-color);
  text-align: left;
  white-space: normal;
}

/* Neutralize the user-agent popover box when the note is participating in document layout.
   The user agent makes popovers scroll containers, which would clip the number that ::before
   places to the left of the note. */
.marginalia-note[popover] {
  border: 0;
  background: transparent;
  color: inherit;
  box-shadow: none;
  overflow: visible;
}

/*
The margin-note layout responds to the width of <main>, not the viewport, because the
ToC is resizable: a wider ToC leaves less room beside the text for notes. <main> is a
query container (see Html/Style.lean), so the container queries below track the actual
content width.

There are two "in the margin" regimes, split at the same width where the content stops
being left-aligned and becomes centered (1112px and 1212px of content width; at the
default ToC width these are the old 1400px and 1500px viewport breakpoints):

  * While the content is left-aligned there is a large area to its right, so a fixed
    13rem note with a fixed 16rem overhang fits comfortably.
  * Once the content is centered the note must fit the symmetric right gap, whose width
    is (content - text column) / 2. A fixed overhang would overflow the page for content
    widths just above the centering threshold, so the note and its overhang are sized in
    container units, which always fit that gap.
*/

/* Narrow viewport (e.g. phone): the ToC is hidden and the note spans the text column. */
@media screen and (width <= 700px) {
  .marginalia-note[popover] {
    position: static;
    float: left;
    clear: left;
    width: 90%;
    margin: 1rem 5%;
  }
}

/* Wider than a phone: by default float the note at the right of the text column,
   overlapping the content. The container queries below lift it into the true margin
   once there is room. */
@media screen and (min-width: 701px) {
  .marginalia-note[popover] {
    display: block;
    position: relative;
    inset: auto;
    float: right;
    clear: right;
    width: 40%;
    margin: 1rem 0;
    margin-left: 10%;
  }

  /* The first note moved immediately before a barrier starts at the barrier's position. */
  .marginalia-note[data-verso-hoisted="before"]:not(.marginalia-note + .marginalia-note) {
    margin-top: 0;
  }
}

/* Left-aligned content: a fixed-size note in the wide area to its right. */
@container main (width >= 1112px) {
  .marginalia-note[popover] {
    float: right;
    clear: right;
    width: 13rem;
    margin: 1rem -16rem 0 0;
  }
}

/* Centered content: size the note in container units so it always fits the symmetric
   right gap. The threshold matches the content-centering threshold in Html/Style.lean,
   so the fixed-overhang note above is only ever used while the content is left-aligned.
   The overhang (18cqi) stays below the gap, (100cqi - text column) / 2, for every
   content width at which the content is centered. */
@container main (width >= 1212px) {
  .marginalia-note[popover] {
    width: 15cqi;
    margin-right: -18cqi;
  }
}

.marginalia-reference.marginalia-highlight, .marginalia-note.marginalia-highlight {
  background-color: var(--verso-selected-color, #def);
  border-radius: 0.2rem;
}

/* The counter must be established inside <main>, whose container declaration (see
   Html/Style.lean) applies style containment: a counter established outside the
   containment boundary cannot be incremented by the notes within it. */
.content-wrapper {
  counter-reset: margin-note-reference-counter margin-note-body-counter;
}

.content-wrapper::after {
  content: "";
  display: block;
  clear: both;
  height: 1rem;
}

.marginalia-reference {
  counter-increment: margin-note-reference-counter;
}
.marginalia-note {
  counter-increment: margin-note-body-counter;
}
.marginalia-note::before {
  content: counter(margin-note-body-counter) ".";
  position: absolute;
  vertical-align: baseline;
  font-size: 0.9em;
  font-weight: bold;
  left: -3rem;
  width: 3rem;
  text-align: right;
}
.marginalia-marker::after {
  content: counter(margin-note-reference-counter);
  vertical-align: super;
  font-size: 0.7em;
  font-weight: bold;
  margin-right: 0.5em;
}

.marginalia-marker-mobile {
  display: none;
}

.marginalia-accessible-label {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@supports selector(:popover-open) {
  @media screen and (width <= 700px) {
    .marginalia-marker-desktop {
      display: none;
    }

    .marginalia-marker-mobile {
      display: inline;
      appearance: none;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .marginalia-marker-mobile:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .marginalia-note[popover] {
      position: fixed;
      float: none;
      inset: 50% auto auto 50%;
      width: calc(100vw - 2rem);
      max-width: min(32rem, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      margin: 0;
      transform: translate(-50%, -50%);
      overflow: auto;
      border: 1px solid currentColor;
      background: var(--verso-code-background-color, white);
      color: inherit;
      box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 30%);
    }

    .marginalia-note[popover]::before {
      content: none;
    }

    .marginalia-note[popover]::backdrop {
      background: rgb(0 0 0 / 18%);
    }
  }
}

// Enable typescript
// @ts-check
/**
 * @type URLSearchParams
 */
let params = new URLSearchParams(document.location.search);
/**
 * @type string[]
 */
let domains = params.getAll("domain");
/**
 * @type string | null
 */
let paramName = params.get("name");

/**
 * @typedef {{id: string, address: string, data: any}} Item // Metadata for one particular item. The `data` depends on the domain.
 * @typedef {Record<string, Item[]>} DomainData // A mapping from canonical names to metadata. The array is usually a singleton.
 * @typedef {{title: string | null, description: string | null, contents: DomainData}} Domain
 * @typedef {Record<string, Domain>} XRef
 */

let xref = /** @type {{xref: XRef}} */ (/** @type {unknown} */ (window)).xref;

/**
 * The replacements for characters that are not valid in slugs. This mirrors the mangling table in
 * MultiVerso.Slug.
 * @type {Record<string, string>}
 */
const slugReplacements = {
    "<": "_LT_",
    ">": "_GT_",
    ";": "_SEMI_",
    "‹": "_FLQ_",
    "›": "_FRQ_",
    "«": "_FLQQ_",
    "»": "_FLQQ_",
    "⟨": "_LANGLE_",
    "⟩": "_RANGLE_",
    "(": "_LPAR_",
    ")": "_RPAR_",
    "[": "_LSQ_",
    "]": "_RSQ_",
    "→": "_ARR_",
    "↦": "_MAPSTO_",
    "⊢": "_VDASH_",
};

/**
 * Converts a string to a valid slug, mangling as appropriate. This mirrors the slug computation in
 * MultiVerso.Slug, so names can be compared with links that were minted from their slugs.
 * @param {string} s
 * @returns {string}
 */
function sluggify(s) {
    let out = "";
    for (const c of s) {
        if (/^[a-zA-Z0-9_-]$/.test(c)) out += c;
        else if (c === " " || c === "\t" || c === "\r" || c === "\n") out += "-";
        else out += slugReplacements[c] ?? "___";
    }
    return out;
}

if (paramName) {
    /**
     * @type (Item & {domain: string})[]
     */
    let options = [];
    if (domains && domains.length > 0) {
        for (const i in domains) {
            let domain = domains[i];
            console.log("Considering domain " + domain);
            if (xref.hasOwnProperty(domain)) {
                console.log("Found domain " + domain);
                let opts = xref[domain];
                if (opts["contents"].hasOwnProperty(paramName)) {
                    options = opts["contents"][paramName].map((x) =>
                        Object.assign(x, { domain: domain }),
                    );
                }
            }
        }
    } else {
        for (const [dom, opts] of Object.entries(xref)) {
            if (opts["contents"].hasOwnProperty(paramName)) {
                for (const i of opts["contents"][paramName]) {
                    options.push(Object.assign(i, { domain: dom }));
                }
            }
        }
    }

    if (options.length == 0) {
        // Permalinks from before a bug fix that separated sections' HTML IDs from their
        // canonical names in the section domain were mangled as slugs. If we don't find
        // any results, we try to recover by checking equality modulo sluggification.
        // This workaround was introduced in August 2026 and should be removed when it
        // seems unlikely for old permalinks to be a significant problem.
        const nameSlug = sluggify(paramName);
        const searchDomains = domains && domains.length > 0 ? domains : Object.keys(xref);
        for (const domain of searchDomains) {
            if (!xref.hasOwnProperty(domain)) continue;
            const contents = xref[domain]["contents"];
            for (const key of Object.keys(contents)) {
                if (sluggify(key) === nameSlug) {
                    for (const i of contents[key]) {
                        options.push(Object.assign(i, { domain: domain }));
                    }
                }
            }
        }
    }

    if (options.length == 0) {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Not found: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Not found: name '" + paramName + "'";
            }
            let allDomains = [];
            for (const d in xref) {
                allDomains.push(d);
            }
            if (domains.length < 1) {
                domains = allDomains;
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Searched domains:</p>
                    <ul>
                        ${domains
                            .map((x) => `<li><code>${x}</code>: ${xref[x]["title"]}</li>`)
                            .join("")}
                    </ul>
                `;
            }
        });
    } else if (options.length == 1) {
        // Currently, our stored options look like absolute paths ('/Axiom').
        // This makes them relative ('Axiom') so that they will be set relative to the <base> tag
        const addr = new URL(options[0]["address"].replace(/^\//, ""), document.baseURI);
        addr.hash = options[0]["id"];
        window.location.replace(addr);
    } else {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Ambiguous: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Ambiguous: name '" + paramName + "'";
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Options:</p>
                    <ul>
                        ${options
                            .map(
                                (x, _idx) =>
                                    `<li>
                                <p>
                                    <a href="${x["address"] + "#" + x["id"]}">
                                        From ${xref[x["domain"]]["title"]}
                                    </a>
                                </p>
                            </li>`,
                            )
                            .join("\n")} +
                    </ul>
                `;
            }
        });
    }
} else {
    addEventListener("DOMContentLoaded", (_event) => {
        document.title = "No name provided";
        const titleElem = document.querySelector("#title");
        if (titleElem) {
            titleElem.innerHTML = "No name provided";
        }
        const messageElem = document.querySelector("#message");
        if (messageElem) {
            messageElem.innerHTML = `
                <p>This page expects a 'name' query parameter, along with documentation domains.</p>
            `;
        }
    });
}
</script>

(() => {
  const setupHover = () => {
    document.querySelectorAll(".marginalia-reference").forEach(reference => {
      const marker = reference.querySelector("[aria-details]");
      const note = marker && document.getElementById(marker.getAttribute("aria-details"));
      if (!note) return;

      const highlight = () => {
        reference.classList.add("marginalia-highlight");
        note.classList.add("marginalia-highlight");
      };
      const unhighlight = () => {
        reference.classList.remove("marginalia-highlight");
        note.classList.remove("marginalia-highlight");
      };
      reference.addEventListener("pointerenter", highlight);
      reference.addEventListener("pointerleave", unhighlight);
      note.addEventListener("pointerenter", highlight);
      note.addEventListener("pointerleave", unhighlight);
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupHover, {once: true});
  } else {
    setupHover();
  }

  const mobile = matchMedia("(width <= 700px)");
  mobile.addEventListener("change", event => {
    if (!event.matches) {
      document.querySelectorAll(".marginalia-note:popover-open")
        .forEach(note => note.hidePopover());
    }
  });
})();
</script>
